version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: persona-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_API_URL must be a build arg, not a runtime `environment:`
      # entry — Next.js bakes NEXT_PUBLIC_* vars into the client bundle when
      # the image is built, so setting it at container start is a no-op.
      args:
        NEXT_PUBLIC_API_URL: https://persona-backend-qm5b.onrender.com
    container_name: persona-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: persona-network
